<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password - Victim's Cart</title>

<style>

/* BACKGROUND */
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #0f2c6c, #1e56a0, #0a1f44);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* CARD */
.container {
    width: 100%;
    max-width: 380px;
    background: #fff;
    padding: 30px;
    border-radius: 14px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.35);
    animation: fadeIn 0.6s ease-in-out;
}

/* TITLE */
h2 {
    text-align: center;
    color: #1e56a0;
    margin-bottom: 20px;
}

/* INPUT */
input {
    width: 100%;
    padding: 12px;
    margin-top: 8px;
    margin-bottom: 15px;
    border: 1px solid #ccc;
    border-radius: 8px;
    outline: none;
    transition: 0.3s;
}

input:focus {
    border-color: #1e56a0;
    box-shadow: 0 0 6px rgba(30,86,160,0.3);
}

/* BUTTON */
button {
    width: 100%;
    padding: 12px;
    background: #1e56a0;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #0f2c6c;
}

/* ANIMATION */
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
}

/* RESPONSIVE */
@media (max-width: 450px) {
    .container {
        margin: 20px;
        padding: 20px;
    }
}

</style>
</head>

<body>

<div class="container">

    <h2>🔐 Forgot Password</h2>

    <form method="POST">

        <input type="email" name="email" placeholder="Enter your email" required>

        <button type="submit">Send OTP</button>

    </form>

</div>

</body>
</html>
