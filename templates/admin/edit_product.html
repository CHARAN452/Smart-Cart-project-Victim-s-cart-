<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Product - Victim's Cart</title>

<style>

/* BODY LAYOUT FIX */
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #0f2c6c, #1e56a0, #0a1f44);
    min-height: 100vh;

    display: flex;
    flex-direction: column;
}

/* CARD */
.container {
    width: 100%;
    max-width: 500px;
    background: #fff;
    padding: 30px;
    border-radius: 14px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.35);
    animation: fadeIn 0.6s ease-in-out;

    margin: auto;   /* centers card */
}

/* TITLE */
h2 {
    text-align: center;
    color: #1e56a0;
    margin-bottom: 20px;
}

/* LABEL */
label {
    font-weight: bold;
    font-size: 14px;
    color: #333;
}

/* INPUTS */
input, textarea {
    width: 100%;
    padding: 12px;
    margin-top: 6px;
    margin-bottom: 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    outline: none;
    transition: 0.3s;
    font-size: 14px;
}

textarea {
    resize: none;
    height: 90px;
}

input:focus, textarea:focus {
    border-color: #1e56a0;
    box-shadow: 0 0 6px rgba(30,86,160,0.3);
}

/* BUTTON */
button {
    width: 100%;
    padding: 12px;
    background: #1e56a0;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #0f2c6c;
}

/* BACK LINK */
.back {
    display: block;
    text-align: center;
    margin-top: 15px;
    color: #1e56a0;
    text-decoration: none;
    font-weight: bold;
}

.back:hover {
    text-decoration: underline;
}

/* IMAGE */
img {
    width: 100%;
    border-radius: 10px;
    margin-top: 10px;
}

/* PREVIEW */
#preview {
    display: none;
    margin-top: 10px;
    border-radius: 10px;
    border: 1px solid #ddd;
}

/* FOOTER FIX */
footer {
    margin-top: auto;
    background: #020617;
    border-top: 1px solid #334155;
    color: #94a3b8;
    padding: 20px 0;
    text-align: center;
}

/* ANIMATION */
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
}

/* RESPONSIVE */
@media (max-width: 500px) {
    .container {
        margin: 20px;
        padding: 20px;
    }
}

</style>
</head>

<body>

<div class="container">

<h2>✏️ Victim's Cart - Edit Product</h2>

<form method="POST" enctype="multipart/form-data">

    <label>Product Name</label>
    <input type="text" name="name" value="{{ product.name }}" required>

    <label>Price</label>
    <input type="number" step="0.01" name="price" value="{{ product.price }}" required>

    <label>Description</label>
    <textarea name="description">{{ product.description }}</textarea>

    <label>Category</label>
    <input type="text" name="category" value="{{ product.category }}">

    <label>Current Image</label>

    {% if product.image %}
        <img src="{{ url_for('static', filename='uploads/product_images/' + product.image) }}">
    {% else %}
        <p>No image available</p>
    {% endif %}

    <label>Change Image</label>
    <input type="file" name="image" onchange="previewImage(event)">
    <small>Leave empty to keep old image</small>

    <img id="preview">

    <button type="submit">Update Product</button>

</form>

<a href="{{ url_for('manage_products') }}" class="back">⬅ Back to Manage Products</a>

</div>

<footer>
    <div class="container">

        <h6 style="color:#22c55e; margin-bottom:10px;">
            🛒 Victim's Cart
        </h6>

        <p style="margin: 0; font-size: 14px;">
            @copyright All rights reserved by <b>Charan</b>
        </p>

        <p style="margin: 5px 0; font-size: 14px;">
            📧 Email: charanv003@gmail.com
        </p>

        <p style="margin: 5px 0; font-size: 14px;">
            📱 Mobile: +91 7799431776
        </p>

        <div style="margin-top:10px;">
            <a href="#" style="color:#94a3b8; margin:0 8px; text-decoration:none;">Facebook</a>
            <a href="#" style="color:#94a3b8; margin:0 8px; text-decoration:none;">Instagram</a>
            <a href="#" style="color:#94a3b8; margin:0 8px; text-decoration:none;">Twitter</a>
        </div>

    </div>
</footer>

<script>
function previewImage(event) {
    const file = event.target.files[0];

    if (file) {
        const reader = new FileReader();
        reader.onload = function () {
            const img = document.getElementById('preview');
            img.src = reader.result;
            img.style.display = "block";
        }
        reader.readAsDataURL(file);
    }
}
</script>

</body>
</html>
