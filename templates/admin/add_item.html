<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Product - SmartCart</title>

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

/* BACKGROUND */
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #0f2c6c, #1e56a0, #0a1f44);
}

/* WRAPPER */
.page-wrapper {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

/* CARD */
.container {
    width: 100%;
    max-width: 450px;
    background: #fff;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    animation: fadeIn 0.6s ease-in-out;
}

/* TITLE */
h2 {
    text-align: center;
    color: #1e56a0;
    margin-bottom: 15px;
}

/* INPUTS */
input, textarea {
    width: 100%;
    padding: 12px;
    margin-top: 6px;
    margin-bottom: 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    outline: none;
    font-size: 14px;
}

textarea {
    resize: none;
    height: 80px;
}

input:focus, textarea:focus {
    border-color: #1e56a0;
    box-shadow: 0 0 5px rgba(30,86,160,0.3);
}

/* BUTTON */
button {
    width: 100%;
    padding: 12px;
    background: #1e56a0;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #0f2c6c;
}

/* BACK BUTTON */
.back-btn {
    background: #444;
    margin-top: 10px;
}

.back-btn:hover {
    background: #222;
}

/* MESSAGE */
.msg {
    color: green;
    text-align: center;
    font-weight: bold;
}

/* IMAGE PREVIEW */
#preview {
    width: 100%;
    margin-top: 10px;
    border-radius: 8px;
    display: none;
}

/* ANIMATION */
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
}

/* FOOTER */
footer {
    background: #020617;
    border-top: 1px solid #334155;
    color: #94a3b8;
    padding: 20px 10px;
    text-align: center;
    width: 100%;
    margin-top: 40px;
}

footer h6 {
    color: #22c55e;
    margin-bottom: 10px;
}

footer a {
    color: #94a3b8;
    margin: 0 8px;
    text-decoration: none;
}

footer a:hover {
    color: #22c55e;
}

/* RESPONSIVE */
@media (max-width: 500px) {
    .container {
        margin: 10px;
        padding: 20px;
    }
}

</style>
</head>

<body>

<div class="page-wrapper">

    <!-- CARD -->
    <div class="container">

        <h2>➕ Add Product</h2>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <p class="msg">{{ message }}</p>
            {% endfor %}
        {% endwith %}

        <form method="POST" enctype="multipart/form-data">

            <label>Product Name</label>
            <input type="text" name="name" required>

            <label>Description</label>
            <textarea name="description" required></textarea>

            <label>Category</label>
            <input type="text" name="category" required>

            <label>Price</label>
            <input type="number" step="0.01" name="price" required>

            <label>Upload Image</label>
            <input type="file" name="image" accept="image/*" onchange="previewImage(event)" required>

            <img id="preview">

            <button type="submit">Add Product</button>

        </form>

        <a href="{{ url_for('admin_dashboard') }}">
            <button class="back-btn" type="button">← Back to Dashboard</button>
        </a>

    </div>

    <!-- FOOTER -->
    <footer>

        <div style="max-width:600px; margin:auto; text-align:center;">

            <h6>🛒 Victim's Cart</h6>

            <p style="margin: 0; font-size: 14px;">
                @copyright All rights reserved by <b>Charan</b>
            </p>

            <p style="margin: 5px 0; font-size: 14px;">
                📧 Email: charanv003@gmail.com
            </p>

            <p style="margin: 5px 0; font-size: 14px;">
                📱 Mobile: +91 7799431776
            </p>

            <div style="margin-top:10px;">
                <a href="#"><i class="fab fa-facebook"></i></a>
                <a href="#"><i class="fab fa-instagram"></i></a>
                <a href="#"><i class="fab fa-twitter"></i></a>
            </div>

        </div>

    </footer>

</div>

<script>
function previewImage(event) {
    const reader = new FileReader();
    reader.onload = function () {
        const img = document.getElementById('preview');
        img.src = reader.result;
        img.style.display = "block";
    }
    reader.readAsDataURL(event.target.files[0]);
}
</script>

</body>
</html>
