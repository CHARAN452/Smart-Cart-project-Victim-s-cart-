<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Signup</title>

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

/* BACKGROUND */
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #0f2c6c, #1e56a0, #0a1f44);
}

/* WRAPPER */
.page-wrapper {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

/* CARD */
.container {
    background: #fff;
    padding: 30px;
    width: 100%;
    max-width: 400px;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    animation: fadeIn 0.6s ease-in-out;
}

/* TITLE */
h2 {
    text-align: center;
    margin-bottom: 20px;
    color: #1e56a0;
}

/* INPUTS */
input {
    width: 100%;
    padding: 12px;
    margin-top: 6px;
    margin-bottom: 15px;
    border: 1px solid #ccc;
    border-radius: 8px;
    outline: none;
}

input:focus {
    border-color: #1e56a0;
    box-shadow: 0 0 5px rgba(30,86,160,0.4);
}

/* BUTTON */
button {
    width: 100%;
    padding: 12px;
    background: #1e56a0;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
}

button:hover {
    background: #0f2c6c;
}

/* BACK BUTTON */
.back-btn {
    margin-top: 10px;
    background: #444;
}

.back-btn:hover {
    background: #222;
}

/* FLASH */
p {
    text-align: center;
    color: green;
    font-weight: bold;
}

/* ANIMATION */
@keyframes fadeIn {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
}

/* FOOTER */
footer {
    background: #020617;
    border-top: 1px solid #334155;
    color: #94a3b8;
    padding: 20px 10px;
    text-align: center;
    width: 100%;
    margin-top: auto;
}

footer h6 {
    color: #22c55e;
    margin-bottom: 10px;
}

footer a {
    color: #94a3b8;
    margin: 0 8px;
    text-decoration: none;
}

footer a:hover {
    color: #22c55e;
}

/* RESPONSIVE */
@media (max-width: 500px) {
    .container {
        margin: 10px;
        padding: 20px;
    }
}

</style>
</head>

<body>

<div class="page-wrapper">

    <!-- SIGNUP CARD -->
    <div class="container">

        <h2>Admin Signup</h2>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% for category, message in messages %}
            <p>{{ message }}</p>
          {% endfor %}
        {% endwith %}

        <form method="POST">

            <label>Name</label>
            <input type="text" name="name" placeholder="Enter your full name" required>

            <label>Email</label>
            <input type="email" name="email" placeholder="Enter your email address" required>

            <button type="submit">Send OTP</button>
        </form>

        <a href="/">
            <button class="back-btn" type="button">← Back to Home</button>
        </a>

    </div>

    <!-- FOOTER -->
    <footer>

        <div style="max-width:600px; margin:auto; text-align:center;">

            <h6>🛒 Victim's Cart</h6>

            <p style="margin: 0; font-size: 14px;">
                @copyright All rights reserved by <b>Charan</b>
            </p>

            <p style="margin: 5px 0; font-size: 14px;">
                📧 Email: charanv003@gmail.com
            </p>

            <p style="margin: 5px 0; font-size: 14px;">
                📱 Mobile: +91 7799431776
            </p>

            <div style="margin-top:10px;">
                <a href="#"><i class="fab fa-facebook"></i></a>
                <a href="#"><i class="fab fa-instagram"></i></a>
                <a href="#"><i class="fab fa-twitter"></i></a>
            </div>

        </div>

    </footer>

</div>

</body>
</html>
