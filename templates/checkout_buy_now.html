<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Checkout - Buy Now</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 50%;
            margin: 50px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #333;
        }

        .product {
            border-bottom: 1px solid #ddd;
            padding: 10px 0;
        }

        .price {
            font-size: 18px;
            color: green;
            font-weight: bold;
        }

        form {
            margin-top: 20px;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #28a745;
            color: white;
            border: none;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #218838;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Buy Now Checkout</h2>

    <!-- Product Section -->
    <div class="product">
        <h3>Product Name: Smart Item</h3>
        <p class="price">Price: ₹999</p>
    </div>

    <!-- Checkout Form -->
    <form method="POST" action="/place-order">

        <label>Full Name</label>
        <input type="text" name="name" required>

        <label>Email</label>
        <input type="email" name="email" required>

        <label>Address</label>
        <textarea name="address" rows="4" required></textarea>

        <label>Phone Number</label>
        <input type="text" name="phone" required>

        <button type="submit">Place Order</button>

    </form>

</div>

</body>
</html>
