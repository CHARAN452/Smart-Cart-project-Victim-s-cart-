<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delivery Address - Victim's Cart</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- FIX: Font Awesome added -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

/* BACKGROUND */
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #020617, #0f172a, #020617);
    color: #f1f5f9;
}

/* CENTER WRAPPER */
.page-wrapper {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 30px 15px;
}

/* CARD */
.address-card {
    background: #0f172a;
    padding: 30px;
    border-radius: 15px;
    width: 100%;
    max-width: 420px;
    border: 1px solid #1e293b;
    box-shadow: 0 0 25px rgba(34,197,94,0.15);
}

/* ICON */
.address-icon {
    font-size: 40px;
    text-align: center;
    margin-bottom: 10px;
}

/* TITLE */
h2 {
    text-align: center;
    margin-bottom: 20px;
}

/* INPUT */
input {
    background: #020617 !important;
    border: 1px solid #334155 !important;
    color: white !important;
}

input::placeholder {
    color: #64748b;
}

/* BUTTON */
button {
    background: #22c55e;
    border: none;
    font-weight: bold;
}

button:hover {
    background: #16a34a;
}

/* FOOTER */
footer {
    background: #020617;
    border-top: 1px solid #334155;
    color: #94a3b8;
    padding: 20px 0;
    text-align: center;
    width: 100%;
    margin-top: 40px;
}

footer h6 {
    color: #22c55e;
    margin-bottom: 10px;
}

footer a {
    color: #94a3b8;
    margin: 0 8px;
    text-decoration: none;
}

footer a:hover {
    color: #22c55e;
}

/* MOBILE */
@media (max-width: 768px) {
    .address-card {
        padding: 20px;
    }
}

</style>
</head>

<body>

<div class="page-wrapper">

    <!-- ADDRESS CARD -->
    <div class="address-card">

        <div class="address-icon">📦📍</div>

        <h2>Delivery Address</h2>

        <form method="POST">

            <input class="form-control mb-2" name="house_no" placeholder="House / Flat No" required>
            <input class="form-control mb-2" name="area" placeholder="Area" required>
            <input class="form-control mb-2" name="locality" placeholder="Locality" required>
            <input class="form-control mb-2" name="mandal" placeholder="Mandal" required>
            <input class="form-control mb-2" name="city" placeholder="City" required>
            <input class="form-control mb-2" name="state" placeholder="State" required>
            <input class="form-control mb-2" name="pincode" placeholder="Pincode" required>

            <button class="btn w-100 mt-2">
                Save Address
            </button>

        </form>

    </div>

    <!-- FOOTER -->
    <footer>

        <div class="container">

            <h6>🛒 Victim's Cart</h6>

            <p style="margin: 0; font-size: 14px;">
                @copyright All rights reserved by <b>Charan</b>
            </p>

            <p style="margin: 5px 0; font-size: 14px;">
                📧 Email: charanv003@gmail.com
            </p>

            <p style="margin: 5px 0; font-size: 14px;">
                📱 Mobile: +91 7799431776
            </p>

            <div style="margin-top:10px;">
                <a href="#"><i class="fab fa-facebook"></i></a>
                <a href="#"><i class="fab fa-instagram"></i></a>
                <a href="#"><i class="fab fa-twitter"></i></a>
            </div>

        </div>

    </footer>

</div>

</body>
</html>
