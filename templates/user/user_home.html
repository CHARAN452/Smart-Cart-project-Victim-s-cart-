<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Dashboard - Victim's Cart</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

<style>

/* BACKGROUND */
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e293b, #020617);
}

/* NAVBAR */
.navbar {
    background: #020617 !important;
    border-bottom: 1px solid #334155;
}

.navbar-brand {
    font-weight: bold;
    font-size: 22px;
    color: #e2e8f0 !important;
}

.navbar-brand:hover {
    color: #22c55e !important;
}

/* TEXT */
.navbar .text-white {
    color: #cbd5f5 !important;
}

/* BUTTON */
.btn-outline-light {
    border-color: #22c55e !important;
    color: #22c55e !important;
}

.btn-outline-light:hover {
    background: #22c55e !important;
    color: #020617 !important;
}

/* CART ICON */
.fa-cart-shopping {
    transition: 0.3s;
}

.fa-cart-shopping:hover {
    color: #22c55e;
    transform: scale(1.2);
}

/* HERO */
.hero-section {
    height: 100vh;
    width: 100%;
    background: url('/static/images/download.jfif') no-repeat center center/cover;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
}

/* OVERLAY */
.hero-section::before {
    content: "";
    position: absolute;
    width: 100%;
    height: 100%;
    background: rgba(2, 6, 23, 0.75);
}

/* TEXT */
.hero-text {
    position: relative;
    text-align: center;
    z-index: 2;
}

.hero-text h1 {
    font-size: 52px;
    font-weight: bold;
    color: #f1f5f9;
    text-shadow: 0 0 10px rgba(34,197,94,0.6);
}

.hero-text p {
    font-size: 20px;
    color: #94a3b8;
}

/* ANIMATION */
.hero-text h1,
.hero-text p {
    animation: fadeInUp 1s ease;
}

@keyframes fadeInUp {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* FOOTER */
footer {
    background: #020617;
    border-top: 1px solid #334155;
    color: #94a3b8;
    padding: 20px 0;
    text-align: center;
}

footer h6 {
    color: #22c55e;
    margin-bottom: 10px;
}

footer a {
    color: #94a3b8;
    margin: 0 8px;
    text-decoration: none;
}

footer a:hover {
    color: #22c55e;
}

</style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">

        <a class="navbar-brand" href="/">🛒 Victim's Cart</a>

        <div class="d-flex align-items-center ms-auto">

            <span class="text-white me-3">Welcome, {{ user_name }}!</span>

            <a href="/products" class="btn btn-outline-light btn-sm me-3">
                🛍️ Start Shopping
            </a>

            <a href="/user/cart" class="text-white fs-4 me-3">
                <i class="fa-solid fa-cart-shopping"></i>
            </a>

            <a class="btn btn-outline-light btn-sm" href="/user-logout">
                Logout
            </a>

        </div>
    </div>
</nav>

<!-- HERO -->
<div class="hero-section">
    <div class="hero-text">
        <h1>Welcome to Victim's Cart</h1>
        <p>Start exploring products now</p>
    </div>
</div>

<!-- FOOTER -->
<!-- FOOTER -->
<footer style="
    background: #020617;
    border-top: 1px solid #334155;
    color: #94a3b8;
    padding: 20px 0;
    text-align: center;
">

    <div class="container">

        <h6 style="color:#22c55e; margin-bottom:10px;">
            🛒 Victim's Cart
        </h6>

        <p style="margin: 0; font-size: 14px;">
            @copyright All rights reserved by <b>Charan</b>
        </p>

        <p style="margin: 5px 0; font-size: 14px;">
            📧 Email: charanv003@gmail.com
        </p>

        <p style="margin: 5px 0; font-size: 14px;">
            📱 Mobile: +91 7799431776
        </p>

        <div style="margin-top:10px;">
            <a href="#" style="color:#94a3b8; margin:0 8px; text-decoration:none;">
                <i class="fab fa-facebook"></i>
            </a>
            <a href="#" style="color:#94a3b8; margin:0 8px; text-decoration:none;">
                <i class="fab fa-instagram"></i>
            </a>
            <a href="#" style="color:#94a3b8; margin:0 8px; text-decoration:none;">
                <i class="fab fa-twitter"></i>
            </a>
        </div>

    </div>

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
