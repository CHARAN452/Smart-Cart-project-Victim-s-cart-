<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Products - Victim's Cart</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e293b, #020617);
    color: #f1f5f9;
}

.navbar {
    background: #020617 !important;
    border-bottom: 1px solid #334155;
}

.navbar-brand {
    font-weight: bold;
    color: #e2e8f0 !important;
}

.nav-link {
    color: #94a3b8 !important;
}

.nav-link:hover,
.nav-link.active {
    color: #22c55e !important;
}

.product-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 20px;
}

.product-card {
    background: #0f172a;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid #334155;
    transition: 0.3s;
}

.product-card:hover {
    transform: translateY(-8px) scale(1.02);
    box-shadow: 0 0 15px rgba(34,197,94,0.4);
}

.product-image {
    position: relative;
    height: 180px;
    overflow: hidden;
}

.product-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.category-badge {
    position: absolute;
    top: 10px;
    left: 10px;
    background: #22c55e;
    color: #020617;
    padding: 4px 10px;
    font-size: 12px;
    border-radius: 20px;
}

.product-info {
    padding: 15px;
}

.price {
    color: #22c55e;
    font-weight: bold;
}

.buttons {
    display: flex;
    gap: 8px;
}

.btn-view {
    flex: 1;
    text-align: center;
    padding: 6px;
    border-radius: 6px;
    border: 1px solid #22c55e;
    color: #22c55e;
    text-decoration: none;
}

.btn-cart {
    flex: 1;
    padding: 6px;
    border-radius: 6px;
    background: #22c55e;
    color: #020617;
    border: none;
    cursor: pointer;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg">
<div class="container">

    <a class="navbar-brand" href="/user-dashboard">🛒 Victim's Cart</a>

    <ul class="navbar-nav ms-auto">

        <li class="nav-item">
            <a class="nav-link" href="/user-dashboard">Home</a>
        </li>

        <li class="nav-item">
            <a class="nav-link active" href="#">Products</a>
        </li>

        <!-- CART COUNT -->
        <li class="nav-item">
            <a class="nav-link" href="/user/cart">
                🛒 Cart
                <span id="cart-count" style="
                    background:#22c55e;
                    color:#000;
                    padding:2px 8px;
                    border-radius:50%;
                    font-size:12px;
                    margin-left:5px;">0</span>
            </a>
        </li>

    </ul>
</div>
</nav>

<div class="container py-4">

<h2>🛍️ Browse Products</h2>

<div class="product-grid">

{% for product in products %}
<div class="product-card">

    <div class="product-image">
        <img src="{{ url_for('static', filename='uploads/product_images/' + product.image) }}">
        <span class="category-badge">{{ product.category }}</span>
    </div>

    <div class="product-info">
        <h3>{{ product.name }}</h3>
        <p class="price">₹{{ product.price }}</p>

        <div class="buttons">
            <a href="#" class="btn-view">View</a>

            <button class="btn-cart"
                onclick="addToCart(this, {{ product.product_id }})">
                Add
            </button>
        </div>
    </div>

</div>
{% endfor %}

</div>
</div>

<!-- SCRIPT -->
<script>
function addToCart(btn, productId) {

    btn.disabled = true;
    btn.innerText = "Adding...";

    fetch("/add-to-cart/" + productId, {
        method: "POST"
    })
    .then(res => res.json())
    .then(data => {

        if (data.status === "login_required") {
            window.location.href = "/user-login";
            return;
        }

        // update cart count
        document.getElementById("cart-count").innerText = data.cart_count;

        btn.innerText = "Added ✔";

        setTimeout(() => {
            btn.innerText = "Add";
            btn.disabled = false;
        }, 1000);

    })
    .catch(err => {
        console.log(err);
        btn.innerText = "Add";
        btn.disabled = false;
    });
}
</script>

</body>
</html>
